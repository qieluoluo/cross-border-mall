server:
  port: 8004

spring:
  application:
    name: shop-payment
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_payment?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.delmon: debug

# 支付宝配置
alipay:
  app-id: 9021000163632997
  private-key: 
  public-key: 
  gateway-url: https://openapi.alipaydev.com/gateway.do  # 沙箱环境
  # gateway-url: https://openapi.alipay.com/gateway.do   # 正式环境
  notify-url: http://你的域名/payment/alipay/notify
  return-url: http://你的域名/payment/alipay/return
