server:
  port: 8008

spring:
  application:
    name: shop-express
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/db_express?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.delmon: debug

express:
  kdniao:
    api-url: http://api.kdniao.com/Ebusiness/EbusinessOrderHandle.aspx
    app-key: your_kdniao_app_key
    e-business-id: your_kdniao_e_business_id